name: Multi-Agent delivery fixture
on:
  push:
    paths:
      - 'fixtures/multi-agent-delivery/**'
      - '.github/workflows/multi-agent-delivery.yml'
  pull_request:
    paths:
      - 'fixtures/multi-agent-delivery/**'
      - '.github/workflows/multi-agent-delivery.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fixtures/multi-agent-delivery
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
